name: Publish

# Push a tag named v<Version>, e.g. v1.1.0, to publish every package at that version.
# The version must match <Version> in Directory.Build.props.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Check tag matches version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          repo_version=$(dotnet msbuild src/Scaidome.Abstractions/Scaidome.Abstractions.csproj -getProperty:Version)
          if [ "$repo_version" != "$version" ]; then
            echo "::error::Tag version $version does not match <Version> $repo_version in Directory.Build.props"
            exit 1
          fi

      - run: dotnet build Scaidome.Packages.slnx -c Release

      - run: dotnet test Scaidome.Packages.slnx -c Release --no-build

      - run: dotnet pack Scaidome.Packages.slnx -c Release --no-build -o artifacts

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate lets a failed run be re-run without failing on packages that already went up.
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
