name: Publish

# Push a tag named <PackageId>/v<Version>, e.g. Scaidome.Abstractions/v1.0.0.
# The version must match <Version> in the package's csproj.
on:
  push:
    tags:
      - '*/v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Resolve package from tag
        id: tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          package="${tag%%/v*}"
          version="${tag#*/v}"
          project="src/${package}/${package}.csproj"
          if [ ! -f "$project" ]; then
            echo "::error::No project for package '$package' ($project)"
            exit 1
          fi
          project_version=$(dotnet msbuild "$project" -getProperty:Version)
          if [ "$project_version" != "$version" ]; then
            echo "::error::Tag version $version does not match <Version> $project_version in $project"
            exit 1
          fi
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - run: dotnet pack "${{ steps.tag.outputs.project }}" -c Release -o artifacts

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
